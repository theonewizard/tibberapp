input MeterReadingInput {
  homeId: ID!
  time: String
  reading: Int!
}

"""Deprecated; will only return default values"""
type MeterReadingResponse {
  homeId: ID! @deprecated(reason: "do not use anymore")
  time: String @deprecated(reason: "always returns `null`")
  reading: Int! @deprecated(reason: "always returns `0`")
}

input UpdateHomeInput {
  homeId: ID!
  appNickname: String

  """The chosen avatar for the home"""
  appAvatar: HomeAvatar

  """The size of the home in square meters"""
  size: Int

  """The type of home"""
  type: HomeType

  """The number of people living in the household"""
  numberOfResidents: Int

  """The primary form of heating in the home"""
  primaryHeatingSource: HeatingSource

  """Whether the home has a ventilation system"""
  hasVentilationSystem: Boolean

  """The main fuse size in amperes"""
  mainFuseSize: Int
}

"""
Real-time measurement data from Pulse or Watty device. For meter connected Pulses, the data update rate is governed by the meter, but may be throttled/batched by Tibber. Differences in meter hardware and/or firmware means that it is not guaranteed that all fields are present in every data frame and furthermore cannot be guaranteed to be fully correct or complete, given that Tibber relies on what the meter provides. Tibber does not normalize or modify the meter data other than to try to handle known meter/firmware bugs and idiosyncrasies. Meter data may be enriched with additional aggregated fields where possible.
"""
type LiveMeasurement {
  """Timestamp when usage occurred"""
  timestamp: String!

  """Consumption at the moment in watts (W)"""
  power: Float!

  """Last meter active import register state in kilowatt-hours (kWh)"""
  lastMeterConsumption: Float

  """Energy consumed since midnight in kilowatt-hours (kWh)"""
  accumulatedConsumption: Float!

  """Net energy produced since midnight in kilowatt-hours (kWh)"""
  accumulatedProduction: Float!

  """Energy consumed since last hour shift in kilowatt-hours (kWh)"""
  accumulatedConsumptionLastHour: Float!

  """Net energy produced since last hour shift in kilowatt-hours (kWh)"""
  accumulatedProductionLastHour: Float!

  """
  Accumulated cost since midnight; requires active Tibber power deal; includes VAT (where applicable)
  """
  accumulatedCost: Float

  """
  Accumulated production reward since midnight; requires active Tibber power deal. Note that this is unrelated to Grid Rewards.
  """
  accumulatedReward: Float

  """Currency of displayed cost; requires active Tibber power deal"""
  currency: String

  """Minimum power consumption since midnight in watts (W)"""
  minPower: Float!

  """Average power consumption since midnight in watts (W)"""
  averagePower: Float!

  """Peak power consumption since midnight in watts (W)"""
  maxPower: Float!

  """Net power production (A-) at the moment in watts (W)"""
  powerProduction: Float

  """Reactive power consumption (Q+) at the moment (kVAr)"""
  powerReactive: Float

  """Net reactive power production (Q-) at the moment (kVAr)"""
  powerProductionReactive: Float

  """Minimum net power production since midnight in watts (W)"""
  minPowerProduction: Float

  """Maximum net power production since midnight in watts (W)"""
  maxPowerProduction: Float

  """Last meter active export register state in kilowatt-hours (kWh)"""
  lastMeterProduction: Float

  """Power factor (active power / apparent power); 0 to 1 where 1 is 100 %"""
  powerFactor: Float

  """
  Voltage on phase 1; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  voltagePhase1: Float

  """
  Voltage on phase 2; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  voltagePhase2: Float

  """
  Voltage on phase 3; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  voltagePhase3: Float

  """
  Current on L1; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  currentL1: Float

  """
  Current on L2; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  currentL2: Float

  """
  Current on L3; on some meters, the value is not part of every data frame, therefore the value can be `null` at certain intervals. It is not guaranteed that single phase installations will be reporting on Phase 1 since Tibber does not normalize this data and only reports what is received from the meter.
  """
  currentL3: Float
  currentPhase1: Float @deprecated(reason: "superseded by `currentL1`")
  currentPhase2: Float @deprecated(reason: "superseded by `currentL2`")
  currentPhase3: Float @deprecated(reason: "superseded by `currentL3`")

  """Device signal strength (Pulse: dB(m); Watty: percent)"""
  signalStrength: Int
}

enum AppScreen {
  HOME
  REPORTS
  CONSUMPTION
  COMPARISON
  DISAGGREGATION
  HOME_PROFILE
  CUSTOMER_PROFILE
  METER_READING
  NOTIFICATIONS
  INVOICES
}

input PushNotificationInput {
  title: String
  message: String!
  screenToOpen: AppScreen
}

type PushNotificationResponse {
  successful: Boolean!
  pushedToNumberOfDevices: Int!
}

type RootMutation {
  """Deprecated; calling this mutation will do nothing"""
  sendMeterReading(input: MeterReadingInput!): MeterReadingResponse! @deprecated(reason: "no longer available")

  """Update home information"""
  updateHome(input: UpdateHomeInput!): Home!

  """Send notification to Tibber app on registered devices"""
  sendPushNotification(input: PushNotificationInput!): PushNotificationResponse!
}

type RootSubscription {
  """Subscribe to real-time measurement stream from Pulse or Watty device"""
  liveMeasurement(homeId: ID!): LiveMeasurement

  """Subscribe to test stream"""
  testMeasurement(count: Int, complete: Boolean): LiveMeasurement
}
