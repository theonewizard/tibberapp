name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint openapi.yaml --fail-severity=warn
      - name: Breaking-change diff against the base branch
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null || {
            echo "No openapi.yaml on the base branch; nothing to compare."; exit 0; }
          docker run --rm -v /tmp:/base -v "$PWD:/head" tufin/oasdiff:v1.11.7 \
            breaking /base/base-openapi.yaml /head/openapi.yaml --fail-on ERR

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency CVE scan
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --strict
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t home-energy:ci .
