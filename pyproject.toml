[project]
name = "home-energy"
version = "0.1.0"
description = "Self-hosted web app for Tibber customers, built only on Tibber's official APIs"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S105", "S106", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
